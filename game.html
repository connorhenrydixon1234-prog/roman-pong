<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roman Ping Pong – The Game</title>
<meta name="description" content="Roman Ping Pong: pick a legionary, Germanic or Briton warrior, choose your projectile and block it with your shield.">
<style>
  html, body { margin: 0; min-height: 100%; background: #2b1d14; color: #f3e6c8;
    font-family: Georgia, 'Times New Roman', serif; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  body { padding: 10px 0; box-sizing: border-box; }
  #wrap { width: 800px; max-width: 95vw; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- Scoreboard + arena ---------- */
  #scoreboard { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: linear-gradient(#5a3b22, #3d2716); border: 3px solid #c9a227; border-bottom: none;
    border-radius: 10px 10px 0 0; padding: 8px 16px; box-sizing: border-box; }
  .team { display: flex; align-items: center; gap: 12px; font-size: 18px; letter-spacing: 1px; flex: 1 1 0; min-width: 0; }
  .team.blue { justify-content: flex-end; text-align: right; }
  .team .score { font-size: 40px; font-weight: bold; min-width: 48px; text-align: center; line-height: 1.1;
    border-radius: 8px; padding: 0 10px; color: #fff; flex: none; }
  .team .numeral { font-size: 14px; opacity: 0.8; display: block; line-height: 1.3; }
  .red .score { background: #b71c1c; box-shadow: 0 0 0 2px #c9a227; }
  .blue .score { background: #1e4fa3; box-shadow: 0 0 0 2px #c0c6cc; }
  .red .name { color: #ff8a80; } .blue .name { color: #90caf9; }
  .mid { text-align: center; font-size: 14px; color: #c9a227; text-transform: uppercase; letter-spacing: 2px; flex: none; }
  canvas#game { display: block; width: 100%; height: auto; border: 3px solid #c9a227; border-top: none; border-bottom: none;
    box-sizing: border-box; touch-action: none; }
  #bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px;
    background: #3d2716; border: 3px solid #c9a227; border-top: 1px solid rgba(201,162,39,0.5); border-radius: 0 0 10px 10px; }
  #bar .help { font-size: 13px; opacity: 0.8; text-align: center; }
  .smallbtn { background: #5a3b22; color: #f3e6c8; border: 1px solid #c9a227; border-radius: 6px;
    padding: 5px 12px; font-size: 13px; letter-spacing: 1px; white-space: nowrap; }
  .smallbtn:hover { background: #b71c1c; }

  /* ---------- Menu ---------- */
  #menu { box-sizing: border-box; border: 3px solid #c9a227; border-radius: 10px; padding: 14px 18px 16px;
    background: radial-gradient(ellipse at top, #5a3b22, #2f2017 75%); display: flex; flex-direction: column; gap: 8px; }
  #menu h1 { margin: 0; text-align: center; color: #e9cf96; font-size: 30px; letter-spacing: 4px; text-transform: uppercase;
    text-shadow: 0 3px 0 #7a5230; }
  #menu .sub { margin: -4px 0 0; text-align: center; color: #c9a227; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; }
  .label { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #c9a227; margin-top: 2px;
    display: flex; align-items: center; gap: 10px; }
  .label::after { content: ''; flex: 1; height: 1px; background: rgba(201,162,39,0.4); }
  .choices { display: grid; gap: 10px; }
  .choices.three { grid-template-columns: repeat(3, 1fr); }
  .choices.four { grid-template-columns: repeat(4, 1fr); }
  .choice { background: rgba(0,0,0,0.25); border: 2px solid rgba(201,162,39,0.35); border-radius: 9px; color: #f3e6c8;
    padding: 6px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center;
    transition: transform 0.12s, border-color 0.12s, background 0.12s; position: relative; min-width: 0; }
  .choice:hover { transform: translateY(-2px); border-color: #c9a227; }
  .choice.selected { border-color: #e6b422; background: rgba(201,162,39,0.22); box-shadow: 0 0 0 2px rgba(230,180,34,0.35); }
  .choice.selected::before { content: '✔'; position: absolute; top: 4px; right: 7px; color: #e6b422; font-size: 13px; }
  .choice canvas { display: block; border-radius: 6px; background: linear-gradient(#e9cf96, #d1a660); max-width: 100%; }
  .choice .cname { font-weight: bold; font-size: 15px; color: #e9cf96; letter-spacing: 1px; }
  .choice .cblurb { font-size: 12px; opacity: 0.75; line-height: 1.25; }
  #p2Choices .cname, #projChoices .cname { font-size: 13px; }
  .random-box { display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: bold;
    color: #7a5230; border-radius: 6px; background: linear-gradient(#e9cf96, #d1a660); }
  #startBtn { align-self: center; margin-top: 4px; background: #b71c1c; color: #fff; border: 2px solid #c9a227; border-radius: 7px;
    font-size: 20px; letter-spacing: 3px; text-transform: uppercase; padding: 10px 40px; transition: transform 0.12s, background 0.12s; }
  #startBtn:hover { transform: translateY(-2px); background: #d32f2f; }
  .menuhelp { text-align: center; font-size: 12px; opacity: 0.65; margin: 0; }

  @media (max-width: 560px) {
    #scoreboard { padding: 6px 8px; }
    .team { font-size: 12px; gap: 6px; letter-spacing: 0; }
    .team .score { font-size: 24px; min-width: 30px; padding: 0 6px; }
    .team .numeral { font-size: 10px; }
    .mid { font-size: 10px; letter-spacing: 1px; }
    #bar .help { display: none; }
    #menu { padding: 10px 8px 12px; }
    #menu h1 { font-size: 21px; letter-spacing: 2px; }
    #menu .sub { font-size: 11px; letter-spacing: 2px; }
    .choices { gap: 6px; }
    .choices.four { grid-template-columns: repeat(2, 1fr); }
    #p2Choices.choices.four { grid-template-columns: repeat(4, 1fr); }
    .choice .cname { font-size: 13px; }
    .choice .cblurb { font-size: 10.5px; }
    #p2Choices .cname { font-size: 11px; }
    #startBtn { font-size: 17px; padding: 9px 28px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stack">
    <div id="gamePanel" class="hidden">
      <div id="scoreboard">
        <div class="team red"><span class="name" id="pname">Legionary (You)</span><span class="score"><span id="ps">0</span><span class="numeral" id="psr">–</span></span></div>
        <div class="mid">First to<br><span id="target">VII</span></div>
        <div class="team blue"><span class="score"><span id="as">0</span><span class="numeral" id="asr">–</span></span><span class="name" id="aname">Legionary (Computer)</span></div>
      </div>
      <canvas id="game" width="800" height="500"></canvas>
      <div id="bar">
        <button class="smallbtn" id="menuBtn" type="button">⟵ Menu (M)</button>
        <span class="help">Mouse, touch, W/S or ↑/↓ to move · Block with your shield!</span>
        <button class="smallbtn" id="pauseBtn" type="button">Pause (Space)</button>
      </div>
    </div>

    <div id="menu">
      <h1>Roman Ping Pong</h1>
      <p class="sub">Choose your warrior</p>
      <div class="label">You</div>
      <div class="choices three" id="p1Choices"></div>
      <div class="label">Your opponent</div>
      <div class="choices four" id="p2Choices"></div>
      <div class="label">Projectile</div>
      <div class="choices four" id="projChoices"></div>
      <button id="startBtn" type="button">To battle!</button>
      <p class="menuhelp">Enter starts the battle · M returns here after a match</p>
    </div>
  </div>
</div>
<script>
// ===== Settings: tweak these to change the game =====
const WIN_SCORE = 7;          // points needed to win
const SHIELD_HEIGHT = 90;     // the shield is the "paddle" (hitbox)
const SHIELD_WIDTH = 14;
const PLAYER_SPEED = 7;       // keyboard speed of your warrior
const AI_SPEED = 5;           // how fast the computer warrior moves (higher = harder)
const MAX_SPEED = 15;         // projectiles never go faster than this

const RED_TEAM  = { shield: '#b71c1c', trim: '#e6b422', tunic: '#c62828', dark: '#7f1414', crest: '#d32f2f', feather: '#ffcdd2', check: '#f7d9a0' };
const BLUE_TEAM = { shield: '#1e4fa3', trim: '#d7dde2', tunic: '#1565c0', dark: '#0d2f66', crest: '#1976d2', feather: '#bbdefb', check: '#cfe3ff' };

const CHARACTERS = {
  legionary: { name: 'Roman legionary', short: 'Legionary', blurb: 'Galea helmet, lorica segmentata, scutum & pilum', draw: drawLegionary },
  germanic:  { name: 'Germanic warrior', short: 'Germanic', blurb: 'Suebian knot, cloak, hex shield & framea', draw: drawGermanic },
  briton:    { name: 'Briton warrior', short: 'Briton', blurb: 'Woad paint, torc, bronze shield & long sword', draw: drawBriton },
};
// shape 'tip' = collides with its point; 'round' = collides with a circle of radius r
const PROJECTILES = {
  arrow: { name: 'Arrow',        blurb: 'Swift and true',      speed: 6.0, speedup: 1.05,  shape: 'tip',   tip: 20 },
  pilum: { name: 'Pilum',        blurb: 'Long, heavy, faster', speed: 6.6, speedup: 1.045, shape: 'tip',   tip: 32 },
  axe:   { name: 'Throwing axe', blurb: 'A spinning francisca', speed: 5.6, speedup: 1.06,  shape: 'round', r: 13 },
  stone: { name: 'Sling stone',  blurb: 'Small but speedy',    speed: 7.0, speedup: 1.05,  shape: 'round', r: 7 },
};

const FACTS = [
  'Augustus, the first Roman emperor, ruled for about 41 years. The month of August is named after him.',
  'Myth: Caligula made his horse Incitatus a consul. Fact: ancient writers only say he planned to – it never happened.',
  'Myth: Nero fiddled while Rome burned in AD 64. Fact: fiddles didn\'t exist yet, and Nero was at Antium when the fire began.',
  'Under Trajan, who was born in Hispania, the empire reached its greatest size in AD 117.',
  'Hadrian\'s Wall, begun in AD 122, ran about 73 miles across northern Britain from the Tyne to the Solway Firth.',
  'Marcus Aurelius wrote his Meditations in Greek – private notes, many written while on campaign by the Danube.',
  'Commodus, son of Marcus Aurelius, fought as a gladiator in the arena. He was strangled by a wrestler in AD 192.',
  'Constantine the Great was proclaimed emperor by his troops at York (Eboracum) in AD 306.',
  'In AD 69, the "Year of the Four Emperors", Galba, Otho, Vitellius and Vespasian all ruled Rome.',
  'The Romans founded Londinium around AD 47–50. Boudica\'s Britons burned it to the ground in about AD 60–61.',
  'A vomitorium was a passage that let crowds pour out of an amphitheatre – not a room for being sick.',
  'The Western Roman Empire fell in AD 476, but the Eastern Roman Empire lasted until 1453.',
];
// =====================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const TOP_LIMIT = 44, BOTTOM_LIMIT = H - SHIELD_HEIGHT - 20; // room for heads, weapons and legs

const params = new URLSearchParams(location.search);
const settings = loadSettings();
const player = { x: 50, y: H / 2 - SHIELD_HEIGHT / 2, score: 0, flash: 0, team: RED_TEAM, facing: 1, kind: 'legionary' };
const ai = { x: W - 50 - SHIELD_WIDTH, y: H / 2 - SHIELD_HEIGHT / 2, score: 0, flash: 0, team: BLUE_TEAM, facing: -1, kind: 'legionary' };
const proj = { kind: 'arrow', x: W / 2, y: H / 2, vx: 0, vy: 0, spin: 0, trail: [], colour: RED_TEAM.feather };
const stats = { blocks: { player: 0, ai: 0 }, matches: 0 };   // handy for testing
const keys = {};
let sparks = [];
let mode = 'menu', paused = false, winner = null, serveTimer = 0;
const demo = params.get('demo') === '1';   // ?demo=1 lets the computer play for you too

function loadSettings() {
  let s = { p1: 'legionary', p2: 'random', proj: 'arrow' };
  try { Object.assign(s, JSON.parse(localStorage.getItem('rpp-settings') || '{}')); } catch (e) {}
  const alias = { javelin: 'pilum', spear: 'pilum', francisca: 'axe', sling: 'stone', roman: 'legionary', german: 'germanic', celt: 'briton' };
  for (const k of ['p1', 'p2', 'proj']) if (params.get(k)) { const v = params.get(k).toLowerCase(); s[k] = alias[v] || v; }
  if (!CHARACTERS[s.p1]) s.p1 = 'legionary';
  if (!CHARACTERS[s.p2] && s.p2 !== 'random') s.p2 = 'random';
  if (!PROJECTILES[s.proj]) s.proj = 'arrow';
  return s;
}
function saveSettings() { try { localStorage.setItem('rpp-settings', JSON.stringify(settings)); } catch (e) {} }

function roman(n) {
  if (n === 0) return '–';
  const map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
  let s = '';
  for (const [v, r] of map) while (n >= v) { s += r; n -= v; }
  return s;
}

function updateScoreboard() {
  document.getElementById('ps').textContent = player.score;
  document.getElementById('as').textContent = ai.score;
  document.getElementById('psr').textContent = roman(player.score);
  document.getElementById('asr').textContent = roman(ai.score);
  document.getElementById('target').textContent = roman(WIN_SCORE);
  document.getElementById('pname').textContent = CHARACTERS[player.kind].short + (demo ? ' (Auto)' : ' (You)');
  document.getElementById('aname').textContent = CHARACTERS[ai.kind].short + ' (Computer)';
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function resetProjectile(direction) {
  const P = PROJECTILES[proj.kind];
  proj.x = W / 2; proj.y = H / 2; proj.trail = []; proj.spin = 0;
  const angle = (Math.random() * 0.5 - 0.25) * Math.PI;
  proj.vx = direction * P.speed * Math.cos(angle);
  proj.vy = P.speed * Math.sin(angle);
  proj.colour = '#f3e6c8';
  serveTimer = 60;
}

function startMatch() {
  player.kind = settings.p1;
  const kinds = Object.keys(CHARACTERS);
  ai.kind = settings.p2 === 'random' ? kinds[Math.floor(Math.random() * kinds.length)] : settings.p2;
  proj.kind = settings.proj;
  player.score = ai.score = 0;
  player.y = ai.y = H / 2 - SHIELD_HEIGHT / 2;
  winner = null; paused = false; sparks = [];
  stats.matches++;
  updateScoreboard();
  updatePauseBtn();
  resetProjectile(Math.random() < 0.5 ? 1 : -1);
}

// The point of the projectile that hits the shield: the tip for long ones, the leading edge for round ones
function frontPoint(x, y) {
  const P = PROJECTILES[proj.kind];
  if (P.shape === 'tip') {
    const s = Math.hypot(proj.vx, proj.vy) || 1;
    return { x: x + proj.vx / s * P.tip, y: y + proj.vy / s * P.tip };
  }
  return { x: x + Math.sign(proj.vx) * P.r, y: y };
}

function tryBlock(p, prevX, prevY) {
  const P = PROJECTILES[proj.kind];
  const f = p.facing;
  const face = f === 1 ? p.x + SHIELD_WIDTH : p.x;
  const a = frontPoint(prevX, prevY), b = frontPoint(proj.x, proj.y);
  // Swept test (so fast projectiles can't tunnel through) + a small window inside the shield
  const sweptAcross = f === 1 ? (a.x >= face && b.x <= face) : (a.x <= face && b.x >= face);
  const inside = f === 1 ? (b.x <= face && b.x >= face - SHIELD_WIDTH) : (b.x >= face && b.x <= face + SHIELD_WIDTH);
  if (!sweptAcross && !inside) return false;
  let hitY = b.y;
  if (sweptAcross && a.x !== b.x) hitY = a.y + (b.y - a.y) * ((a.x - face) / (a.x - b.x));
  const margin = 6 + (P.shape === 'round' ? P.r * 0.7 : 0);
  if (hitY < p.y - margin || hitY > p.y + SHIELD_HEIGHT + margin) return false;

  // Where it hit the shield (-1 top, 0 middle, 1 bottom) sets the bounce angle
  const hit = clamp((hitY - (p.y + SHIELD_HEIGHT / 2)) / (SHIELD_HEIGHT / 2), -1, 1);
  const speed = Math.min(MAX_SPEED, Math.hypot(proj.vx, proj.vy) * P.speedup);
  const angle = hit * Math.PI / 4;
  proj.vx = f * speed * Math.cos(angle);
  proj.vy = speed * Math.sin(angle);
  proj.x = face + f * (P.shape === 'tip' ? P.tip * 0.45 : P.r + 1);
  proj.y = clamp(hitY, 8, H - 8);
  proj.colour = p.team.feather;
  p.flash = 8;
  if (p === player) stats.blocks.player++; else stats.blocks.ai++;
  for (let i = 0; i < 12; i++) {
    sparks.push({ x: face, y: hitY, vx: f * Math.random() * 4, vy: (Math.random() - 0.5) * 5, life: 18 + Math.random() * 10 });
  }
  return true;
}

function aiFollow(p, speed) {
  const centre = p.y + SHIELD_HEIGHT / 2;
  if (centre < proj.y - 10) p.y += speed;
  else if (centre > proj.y + 10) p.y -= speed;
  p.y = clamp(p.y, TOP_LIMIT, BOTTOM_LIMIT);
}

function update() {
  if (demo) aiFollow(player, AI_SPEED);
  if (keys['w'] || keys['arrowup']) player.y -= PLAYER_SPEED;
  if (keys['s'] || keys['arrowdown']) player.y += PLAYER_SPEED;
  player.y = clamp(player.y, TOP_LIMIT, BOTTOM_LIMIT);
  aiFollow(ai, AI_SPEED);

  [player, ai].forEach(p => { if (p.flash > 0) p.flash--; });
  sparks.forEach(s => { s.x += s.vx; s.y += s.vy; s.vy += 0.2; s.life--; });
  sparks = sparks.filter(s => s.life > 0);

  if (serveTimer > 0) { serveTimer--; return; }

  const P = PROJECTILES[proj.kind];
  const prevX = proj.x, prevY = proj.y;
  proj.trail.push({ x: proj.x, y: proj.y });
  if (proj.trail.length > 9) proj.trail.shift();
  proj.x += proj.vx;
  proj.y += proj.vy;
  proj.spin += Math.sign(proj.vx) * (0.12 + Math.hypot(proj.vx, proj.vy) * 0.025);

  const edge = P.shape === 'round' ? P.r : 6;
  if (proj.y <= edge) { proj.y = edge; proj.vy = Math.abs(proj.vy); }
  if (proj.y >= H - edge) { proj.y = H - edge; proj.vy = -Math.abs(proj.vy); }

  if (proj.vx < 0) tryBlock(player, prevX, prevY);
  else if (proj.vx > 0) tryBlock(ai, prevX, prevY);

  if (proj.x < -40) { ai.score++; scored(); resetProjectile(1); }
  else if (proj.x > W + 40) { player.score++; scored(); resetProjectile(-1); }
}

function scored() {
  updateScoreboard();
  const fact = FACTS[Math.floor(Math.random() * FACTS.length)];
  if (player.score >= WIN_SCORE) winner = { title: 'VICTORIA!', sub: 'Your ' + CHARACTERS[player.kind].name + ' triumphs', fact };
  else if (ai.score >= WIN_SCORE) winner = { title: 'DEFEAT', sub: 'The computer\'s ' + CHARACTERS[ai.kind].name + ' wins', fact };
}

// ---------- Drawing helpers ----------
function line(g, x1, y1, x2, y2) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function poly(g, pts) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fill(); }
function bodyX(x, f) { return f === 1 ? x - 16 : x + SHIELD_WIDTH + 16; } // body centre, behind the shield

function drawFlash(g, flash, path) {
  if (flash > 0) { g.fillStyle = `rgba(255,255,255,${flash / 10})`; path(); g.fill(); }
}

// ---------- Characters (x, y = top-left of the shield hitbox, f = facing: 1 right, -1 left) ----------
function drawLegionary(g, x, y, f, t, flash) {
  const SH = SHIELD_HEIGHT, sx = bodyX(x, f), px = sx - f * 12;
  // Pilum (behind the body): wooden shaft, long iron shank, small point
  g.strokeStyle = '#6d4c2f'; g.lineWidth = 3; line(g, px, y - 22, px, y + SH + 12);
  g.strokeStyle = '#7b848c'; g.lineWidth = 1.6; line(g, px, y - 22, px, y - 34);
  g.fillStyle = '#9ea7ad'; poly(g, [px, y - 42, px - 3, y - 33, px + 3, y - 33]);
  // Legs and sandals
  g.fillStyle = '#e0b084';
  g.fillRect(sx - 7, y + SH - 6, 5, 20); g.fillRect(sx + 2, y + SH - 6, 5, 20);
  g.strokeStyle = '#5d3a1a'; g.lineWidth = 1;
  for (let i = 0; i < 3; i++) { line(g, sx - 7, y + SH + 2 + i * 4, sx - 2, y + SH + 4 + i * 4); line(g, sx + 2, y + SH + 2 + i * 4, sx + 7, y + SH + 4 + i * 4); }
  g.fillStyle = '#5d3a1a';
  g.fillRect(sx - 8, y + SH + 11, 7, 4); g.fillRect(sx + 1, y + SH + 11, 7, 4);
  // Tunic
  g.fillStyle = t.tunic; g.fillRect(sx - 10, y + 16, 20, SH - 22);
  // Belt with hanging straps
  g.fillStyle = '#5d3a1a'; g.fillRect(sx - 11, y + 50, 22, 4);
  for (let i = 0; i < 4; i++) g.fillRect(sx - 8 + i * 5, y + 54, 2, 12);
  // Armour (lorica segmentata)
  g.fillStyle = '#b8bec4'; g.fillRect(sx - 11, y + 16, 22, 34);
  g.fillStyle = '#cfd4d8'; g.fillRect(sx - 12, y + 15, 24, 7);
  g.strokeStyle = '#7b848c'; g.lineWidth = 1;
  for (let i = 0; i < 4; i++) line(g, sx - 11, y + 25 + i * 7, sx + 11, y + 25 + i * 7);
  // Head
  g.fillStyle = '#e0b084'; circle(g, sx, y + 4, 10);
  g.fillStyle = '#222'; circle(g, sx + f * 5, y + 3, 1.6);
  // Helmet (galea) with neck guard, cheek guard and brow band
  g.fillStyle = '#c9cfd4';
  g.beginPath(); g.arc(sx, y + 2, 11, Math.PI, Math.PI * 2); g.fill();
  g.fillRect(f === 1 ? sx - 14 : sx + 8, y + 1, 6, 4);           // neck guard
  g.fillStyle = '#aeb6bc'; g.fillRect(f === 1 ? sx - 3 : sx - 1, y + 2, 4, 10);  // cheek guard
  g.strokeStyle = '#7b848c'; g.lineWidth = 0.8; g.strokeRect(f === 1 ? sx - 3 : sx - 1, y + 2, 4, 10);
  g.fillStyle = '#e6b422'; g.fillRect(sx - 12, y + 1, 24, 2);
  // Crest
  g.fillStyle = t.crest;
  g.beginPath(); g.ellipse(sx, y - 9, 13, 7, 0, Math.PI, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.25)'; for (let i = -9; i <= 9; i += 4) line(g, sx + i, y - 9, sx + i * 1.1, y - 14);
  // Scutum (rectangular, curved) – the hitbox
  const path = () => { g.beginPath(); g.roundRect(x, y, SHIELD_WIDTH, SH, 5); };
  g.fillStyle = t.shield; path(); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(x + (f === 1 ? 2 : SHIELD_WIDTH - 6), y + 4, 4, SH - 8);
  g.strokeStyle = t.trim; g.lineWidth = 2;
  g.beginPath(); g.roundRect(x + 1, y + 1, SHIELD_WIDTH - 2, SH - 2, 4); g.stroke();

function drawGermanic(g, x, y, f, t, flash) {
  const SH = SHIELD_HEIGHT, sx = bodyX(x, f), px = sx - f * 15;
  const skin = '#e8bc8f', hair = '#b8863b', hairDark = '#8a6128';
  // Framea (spear with a short, narrow iron head)
  g.strokeStyle = '#7a5a36'; g.lineWidth = 3; line(g, px, y - 20, px, y + SH + 10);
  g.fillStyle = '#8f989e'; poly(g, [px, y - 36, px - 3, y - 25, px, y - 19, px + 3, y - 25]);
  // Cloak (sagum) behind the body
  g.fillStyle = t.dark;
  poly(g, [sx + f * 6, y + 13, sx - f * 10, y + 13, sx - f * 21, y + SH + 4, sx - f * 4, y + SH]);
  g.fillStyle = t.tunic;
  poly(g, [sx + f * 4, y + 13, sx - f * 9, y + 13, sx - f * 17, y + SH + 2, sx - f * 5, y + SH - 4]);
  // Trousers with leg wraps, leather shoes
  g.fillStyle = '#6b5a48';
  g.fillRect(sx - 9, y + SH - 18, 18, 8);
  g.fillRect(sx - 8, y + SH - 12, 7, 24); g.fillRect(sx + 1, y + SH - 12, 7, 24);
  g.strokeStyle = '#3f3428'; g.lineWidth = 1;
  for (let i = 0; i < 4; i++) { line(g, sx - 8, y + SH - 1 + i * 3.5, sx - 1, y + SH + 1 + i * 3.5); line(g, sx + 1, y + SH - 1 + i * 3.5, sx + 8, y + SH + 1 + i * 3.5); }
  g.fillStyle = '#3e2a1a'; g.fillRect(sx - 9, y + SH + 11, 8, 4); g.fillRect(sx + 1, y + SH + 11, 8, 4);
  // Bare chest and belt
  g.fillStyle = skin; g.fillRect(sx - 10, y + 14, 20, SH - 31);
  g.strokeStyle = 'rgba(120,70,30,0.35)'; line(g, sx - 5, y + 30, sx + 5, y + 30); line(g, sx, y + 34, sx, y + SH - 26);
  g.fillStyle = '#4e3421'; g.fillRect(sx - 10, y + SH - 20, 20, 4);
  g.fillStyle = '#c9a227'; g.fillRect(sx + f * 2 - 2, y + SH - 21, 4, 6);
  // Cloak strap over the shoulder with a brooch (fibula)
  g.strokeStyle = t.tunic; g.lineWidth = 4; line(g, sx - f * 9, y + 14, sx + f * 7, y + 34);
  g.fillStyle = '#e6b422'; circle(g, sx - f * 5, y + 17, 2.6);
  // Arm holding the spear
  g.strokeStyle = skin; g.lineWidth = 5; line(g, sx - f * 6, y + 18, px, y + 44);
  // Long hair behind the head
  g.fillStyle = hair;
  poly(g, [sx + f * 4, y - 6, sx - f * 9, y - 5, sx - f * 14, y + 24, sx - f * 3, y + 20]);
  // Head, hair cap, Suebian knot, beard
  g.fillStyle = skin; circle(g, sx, y + 4, 10);
  g.fillStyle = hair;
  g.beginPath(); g.arc(sx, y + 3, 10.6, Math.PI, Math.PI * 2); g.fill();
  g.fillRect(f === 1 ? sx - 10.6 : sx + 4, y + 2, 6.6, 9);
  g.fillStyle = hair; circle(g, sx - f * 3, y - 9, 5);
  g.strokeStyle = hairDark; g.lineWidth = 1.2;
  g.beginPath(); g.arc(sx - f * 3, y - 9, 5, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(sx - f * 3, y - 9, 2.2, 0, Math.PI * 1.5); g.stroke();
  g.fillStyle = hair;
  poly(g, [sx - f * 1, y + 7, sx + f * 10, y + 6, sx + f * 8, y + 17, sx + f * 2, y + 21, sx - f * 3, y + 13]);
  g.fillStyle = '#222'; circle(g, sx + f * 5, y + 2, 1.6);
  g.strokeStyle = hairDark; g.lineWidth = 1.5; line(g, sx + f * 3, y - 1, sx + f * 8, y - 1);
  // Tall hexagonal wooden shield with an iron boss – the hitbox
  const path = () => { g.beginPath(); g.moveTo(x + 7, y - 3); g.lineTo(x + 15, y + 13); g.lineTo(x + 15, y + SH - 13);

  g.fillStyle = t.shield; path(); g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = 1; line(g, x + 3.5, y + 4, x + 3.5, y + SH - 4); line(g, x + 10.5, y + 4, x + 10.5, y + SH - 4);
  g.strokeStyle = '#4e342e'; g.lineWidth = 2.2; path(); g.stroke();

function drawBriton(g, x, y, f, t, flash) {
  const SH = SHIELD_HEIGHT, sx = bodyX(x, f), wx = sx - f * 14;
  const skin = '#efc9a0', woad = '#2f56c4', lime = '#f2ead0';
  // Long iron sword held upright behind the body
  g.fillStyle = '#c3cbd1'; poly(g, [wx - 2, y + 30, wx + 2, y + 30, wx + 2, y - 22, wx, y - 30, wx - 2, y - 22]);
  g.strokeStyle = '#8b949a'; g.lineWidth = 1; line(g, wx, y + 28, wx, y - 24);
  g.fillStyle = '#c9a227'; g.fillRect(wx - 6, y + 30, 12, 3);
  g.fillStyle = '#5d3a1a'; g.fillRect(wx - 2, y + 33, 4, 10);
  g.fillStyle = '#c9a227'; circle(g, wx, y + 45, 3);
  // Checked (plaid) trousers
  g.fillStyle = t.tunic;
  g.fillRect(sx - 9, y + SH - 20, 18, 9);
  g.fillRect(sx - 8, y + SH - 13, 7, 25); g.fillRect(sx + 1, y + SH - 13, 7, 25);
  g.strokeStyle = t.check; g.lineWidth = 1;
  for (let yy = y + SH - 17; yy < y + SH + 11; yy += 5) { line(g, sx - 9, yy, sx - 1, yy); line(g, sx + 1, yy, sx + 9, yy); }
  g.strokeStyle = t.dark; g.lineWidth = 1.5;
  line(g, sx - 4.5, y + SH - 20, sx - 4.5, y + SH + 12); line(g, sx + 4.5, y + SH - 20, sx + 4.5, y + SH + 12);
  g.fillStyle = '#3e2a1a'; g.fillRect(sx - 9, y + SH + 11, 8, 4); g.fillRect(sx + 1, y + SH + 11, 8, 4);
  // Bare chest with woad swirls, belt
  g.fillStyle = skin; g.fillRect(sx - 10, y + 14, 20, SH - 33);
  g.strokeStyle = woad; g.lineWidth = 1.6;
  g.beginPath(); g.arc(sx - 3, y + 28, 4, 0, Math.PI * 1.6); g.stroke();
  g.beginPath(); g.arc(sx + 4, y + 40, 4, Math.PI, Math.PI * 2.6); g.stroke();
  line(g, sx - 8, y + 50, sx + 8, y + 46);
  g.fillStyle = '#4e3421'; g.fillRect(sx - 10, y + SH - 22, 20, 4);
  // Arm holding the sword, with woad bands
  g.strokeStyle = skin; g.lineWidth = 5; line(g, sx - f * 6, y + 18, wx, y + 38);
  g.strokeStyle = woad; g.lineWidth = 2; line(g, sx - f * 8.5, y + 25, sx - f * 11.5, y + 27); line(g, sx - f * 10.5, y + 31, sx - f * 13, y + 33);
  // Head with woad face paint
  g.fillStyle = skin; circle(g, sx, y + 4, 10);
  g.strokeStyle = woad; g.lineWidth = 1.8;
  line(g, sx + f * 1, y + 6, sx + f * 9, y + 7); line(g, sx - f * 1, y + 10, sx + f * 6, y + 12);
  g.fillStyle = '#222'; circle(g, sx + f * 5, y + 3, 1.6);
  // Drooping moustache
  g.strokeStyle = '#9c8148'; g.lineWidth = 2.6;
  g.beginPath(); g.moveTo(sx + f * 4, y + 9); g.quadraticCurveTo(sx + f * 10, y + 8, sx + f * 9, y + 14); g.stroke();
  // Spiky limed hair
  g.fillStyle = lime;
  g.beginPath(); g.arc(sx, y + 3, 10.5, Math.PI, Math.PI * 2); g.fill();
  g.strokeStyle = '#bfae7a'; g.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const a = Math.PI + 0.25 + i * (Math.PI - 0.5) / 5;
    const tipA = a - f * 0.35;
    const pts = [sx + Math.cos(a - 0.2) * 9, y + 3 + Math.sin(a - 0.2) * 9, sx + Math.cos(tipA) * 21, y + 3 + Math.sin(tipA) * 21,
                 sx + Math.cos(a + 0.2) * 9, y + 3 + Math.sin(a + 0.2) * 9];
    g.fillStyle = lime; poly(g, pts); g.stroke();
  }
  // Gold torc
  g.strokeStyle = '#e6b422'; g.lineWidth = 3;
  g.beginPath(); g.arc(sx, y + 12, 7, 0.1 * Math.PI, 0.9 * Math.PI); g.stroke();
  g.fillStyle = '#f5cf4a'; circle(g, sx + Math.cos(0.1 * Math.PI) * 7, y + 12 + Math.sin(0.1 * Math.PI) * 7, 2.3);
  circle(g, sx + Math.cos(0.9 * Math.PI) * 7, y + 12 + Math.sin(0.9 * Math.PI) * 7, 2.3);
  // Long narrow bronze shield (Witham/Battersea style) with enamel roundels – the hitbox
  const path = () => { g.beginPath(); g.ellipse(x + 7, y + SH / 2, 8.5, SH / 2 + 4, 0, 0, Math.PI * 2); };
  const grad = g.createLinearGradient(x - 2, 0, x + 16, 0);
  grad.addColorStop(0, '#8a5a1c'); grad.addColorStop(0.5, '#e0ac4c'); grad.addColorStop(1, '#8a5a1c');
  g.fillStyle = grad; path(); g.fill();
  g.strokeStyle = t.shield; g.lineWidth = 2.6; path(); g.stroke();
  g.strokeStyle = 'rgba(90,55,15,0.7)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(x + 7, y + 22); g.quadraticCurveTo(x + 13, y + 30, x + 7, y + 36); g.stroke();
  g.beginPath(); g.moveTo(x + 7, y + SH - 22); g.quadraticCurveTo(x + 1, y + SH - 30, x + 7, y + SH - 36); g.stroke();
  g.fillStyle = t.shield; circle(g, x + 7, y + 13, 3.8); circle(g, x + 7, y + SH - 13, 3.8);
  g.fillStyle = '#f5cf4a'; circle(g, x + 7, y + 13, 1.4); circle(g, x + 7, y + SH - 13, 1.4);
  g.fillStyle = '#b07a2a'; circle(g, x + 7 + f, y + SH / 2, 7);
  g.fillStyle = t.shield; circle(g, x + 7 + f, y + SH / 2, 4);
  g.fillStyle = '#f5cf4a'; circle(g, x + 7 + f * 1.5, y + SH / 2 - 1, 1.6);
  drawFlash(g, flash, path);
}

// ---------- Projectiles ----------
function drawProjectile(g, kind, x, y, angle, spin, colour) {
  g.save();
  g.translate(x, y);
  if (kind === 'arrow') {
    g.rotate(angle);
    g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 3; line(g, -17, 6, 14, 6);
    g.strokeStyle = '#7a5230'; g.lineWidth = 3; line(g, -17, 0, 13, 0);
    g.fillStyle = '#5f6a72'; poly(g, [20, 0, 11, -5, 11, 5]);
    g.fillStyle = colour;
    poly(g, [-10, 0, -19, -6, -15, 0]); poly(g, [-10, 0, -19, 6, -15, 0]);
  } else if (kind === 'pilum') {
    g.rotate(angle);
    g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 3.5; line(g, -32, 7, 30, 7);
    g.strokeStyle = '#8a6238'; g.lineWidth = 3.5; line(g, -32, 0, 6, 0);       // wooden shaft
    g.fillStyle = colour; g.fillRect(-14, -2.5, 6, 5);                          // grip binding
    g.fillStyle = '#4b5258'; g.fillRect(3, -3, 5, 6);                            // weight / socket
    g.strokeStyle = '#6f787f'; g.lineWidth = 1.6; line(g, 8, 0, 27, 0);         // thin iron shank
    g.fillStyle = '#4b5258'; poly(g, [32, 0, 26, -3, 26, 3]);                    // small pyramid point
    g.fillStyle = '#4b5258'; poly(g, [-36, 0, -32, -2, -32, 2]);                 // butt spike
  } else if (kind === 'axe') {
    g.fillStyle = 'rgba(0,0,0,0.15)'; g.beginPath(); g.ellipse(0, 12, 13, 3, 0, 0, Math.PI * 2); g.fill();
    g.rotate(spin); g.scale(1.2, 1.2); g.translate(-3, 4);
    g.strokeStyle = 'rgba(120,80,30,0.25)'; g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, 15, 0.3, 1.6); g.stroke(); g.beginPath(); g.arc(0, 0, 15, Math.PI + 0.3, Math.PI + 1.6); g.stroke();
    g.strokeStyle = '#7a5230'; g.lineWidth = 3.5; line(g, 0, 12, 0, -9);          // haft
    g.fillStyle = colour; g.fillRect(-2.5, 7, 5, 4);                              // grip wrap
    g.fillStyle = '#6f787f';                                                      // francisca head
    g.beginPath(); g.moveTo(-3, -12); g.lineTo(2, -13); g.quadraticCurveTo(7, -16, 11, -20);
    g.quadraticCurveTo(14, -12, 11, -3); g.quadraticCurveTo(6, -7, 2, -6); g.lineTo(-3, -6); g.closePath(); g.fill();
    g.strokeStyle = '#d5dbe0'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(11, -19); g.quadraticCurveTo(13.5, -12, 11, -4); g.stroke();
  } else { // sling stone
    g.fillStyle = 'rgba(0,0,0,0.18)'; g.beginPath(); g.ellipse(0, 8, 6, 2, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#8a8274'; circle(g, 0, 0, 7);
    g.fillStyle = '#b3ab9c'; circle(g, -2, -2.3, 2.8);
    g.fillStyle = '#5f584d'; circle(g, 2.8, 2.5, 1.4);
    g.strokeStyle = '#4a443b'; g.lineWidth = 1; g.beginPath(); g.arc(0, 0, 7, 0, Math.PI * 2); g.stroke();
  }
  g.restore();
}

function drawArena() {
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#e9cf96'); grd.addColorStop(1, '#d1a660');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(183,28,28,0.10)'; ctx.fillRect(0, 0, 120, H);
  ctx.fillStyle = 'rgba(30,79,163,0.10)'; ctx.fillRect(W - 120, 0, 120, H);
  ctx.strokeStyle = 'rgba(120,80,30,0.35)';
  ctx.lineWidth = 3;
  ctx.setLineDash([16, 12]);
  line(ctx, W / 2, 0, W / 2, H);
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 60, 0, Math.PI * 2); ctx.stroke();
}

function wrapLines(text, maxWidth) {
  const lines = [];
  let lineText = '';
  for (const w of text.split(' ')) {
    const test = lineText ? lineText + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && lineText) { lines.push(lineText); lineText = w; } else lineText = test;
  }
  lines.push(lineText);
  return lines;
}

function draw() {
  drawArena();
  CHARACTERS[player.kind].draw(ctx, player.x, player.y, player.facing, player.team, player.flash);
  CHARACTERS[ai.kind].draw(ctx, ai.x, ai.y, ai.facing, ai.team, ai.flash);
  if (!winner) {
    if (proj.kind === 'stone' && serveTimer === 0) {
      proj.trail.forEach((p, i) => {
        ctx.fillStyle = `rgba(110,100,85,${(i + 1) / proj.trail.length * 0.35})`;
        circle(ctx, p.x, p.y, 2 + (i / proj.trail.length) * 4);
      });
    }
    drawProjectile(ctx, proj.kind, proj.x, proj.y, Math.atan2(proj.vy, proj.vx), proj.spin, proj.colour);
  }

  sparks.forEach(s => {
    ctx.fillStyle = `rgba(255,${180 + Math.floor(Math.random() * 60)},60,${s.life / 28})`;
    ctx.fillRect(s.x, s.y, 3, 3);
  });

  ctx.textAlign = 'center';
  if (winner) {
    ctx.fillStyle = 'rgba(40,25,10,0.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e6b422';
    ctx.font = 'bold 56px Georgia, serif';
    ctx.fillText(winner.title, W / 2, 130);
    ctx.fillStyle = '#f3e6c8';
    ctx.font = '22px Georgia, serif';
    ctx.fillText(winner.sub + '  ' + roman(player.score) + ' – ' + roman(ai.score), W / 2, 172);
    // Fun fact scroll, sized to fit the fact
    ctx.font = '19px Georgia, serif';
    const lines = wrapLines(winner.fact, W - 270);
    const boxH = 62 + lines.length * 27;
    ctx.fillStyle = 'rgba(233,207,150,0.95)';
    ctx.beginPath(); ctx.roundRect(110, 205, W - 220, boxH, 10); ctx.fill();
    ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#7a5230'; ctx.font = 'bold 15px Georgia, serif';
    ctx.fillText('ROMAN FUN FACT', W / 2, 235);
    ctx.fillStyle = '#2b1d14'; ctx.font = '19px Georgia, serif';
    lines.forEach((l, i) => ctx.fillText(l, W / 2, 268 + i * 27));
    ctx.fillStyle = '#f3e6c8'; ctx.font = '18px Georgia, serif';
    ctx.fillText('Click or press Space to fight again  ·  M for the menu', W / 2, 205 + boxH + 45);
  } else if (paused) {
    ctx.fillStyle = 'rgba(40,25,10,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e6b422';
    ctx.font = 'bold 54px Georgia, serif';
    ctx.fillText('PAUSED', W / 2, H / 2 - 10);
    ctx.fillStyle = '#f3e6c8';
    ctx.font = '20px Georgia, serif';
    ctx.fillText('Press Space to resume  ·  M for the menu', W / 2, H / 2 + 30);
  } else if (serveTimer > 20 && player.score === 0 && ai.score === 0) {
    ctx.fillStyle = 'rgba(43,29,20,0.75)';
    ctx.font = 'bold 26px Georgia, serif';
    ctx.fillText(CHARACTERS[player.kind].short.toUpperCase() + '  vs  ' + CHARACTERS[ai.kind].short.toUpperCase(), W / 2, 90);
  }
}

function loop() {
  if (mode === 'play') {
    if (!paused && !winner) update();
    draw();
  }
  requestAnimationFrame(loop);
}

// ---------- Menu ----------
function previewCanvas(w, h) {
  const c = document.createElement('canvas');
  const dpr = Math.max(2, window.devicePixelRatio || 1);
  c.width = w * dpr; c.height = h * dpr; c.style.width = w + 'px'; c.style.height = h + 'px';
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  return { c, g };
}
// Draws a character centred in a w x h box (used for the menu cards and the website images)
function drawCharacterPreview(g, kind, w, h, facing, team) {
  const s = Math.min(w / 64, h / 156);
  g.save();
  g.translate(w / 2, h / 2 + 2);
  g.scale(s, s);
  const midX = facing === 1 ? -9 : 23;  // horizontal centre of the drawing relative to the shield's left edge
  CHARACTERS[kind].draw(g, -midX, -36, facing, team, 0);
  g.restore();
}

function buildMenu() {
  const p1 = document.getElementById('p1Choices'), p2 = document.getElementById('p2Choices'), pr = document.getElementById('projChoices');
  for (const [key, ch] of Object.entries(CHARACTERS)) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'choice'; b.dataset.group = 'p1'; b.dataset.value = key;
    const { c, g } = previewCanvas(92, 128); drawCharacterPreview(g, key, 92, 128, 1, RED_TEAM);
    b.append(c);
    b.insertAdjacentHTML('beforeend', `<span class="cname">${ch.short}</span><span class="cblurb">${ch.blurb}</span>`);
    b.title = ch.name;
    p1.append(b);
  }
  for (const [key, ch] of [...Object.entries(CHARACTERS), ['random', { short: 'Random', name: 'Random opponent' }]]) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'choice'; b.dataset.group = 'p2'; b.dataset.value = key;
    if (key === 'random') {
      const d = document.createElement('div'); d.className = 'random-box'; d.textContent = '?'; d.style.width = '54px'; d.style.height = '78px'; b.append(d);
    } else {
      const { c, g } = previewCanvas(54, 78); drawCharacterPreview(g, key, 54, 78, -1, BLUE_TEAM); b.append(c);
    }
    b.insertAdjacentHTML('beforeend', `<span class="cname">${ch.short}</span>`);
    b.title = ch.name;
    p2.append(b);
  }
  for (const [key, P] of Object.entries(PROJECTILES)) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'choice'; b.dataset.group = 'proj'; b.dataset.value = key;
    const { c, g } = previewCanvas(96, 36);
    if (key === 'stone') {
      for (let i = 0; i < 6; i++) { g.fillStyle = `rgba(110,100,85,${(i + 1) / 6 * 0.35})`; circle(g, 22 + i * 7, 18, 2 + i * 0.7); }
      drawProjectile(g, key, 70, 17, 0, 0, '#ffcdd2');
    } else if (key === 'axe') drawProjectile(g, key, 46, 20, 0, 0.5, '#ffcdd2');
    else if (key === 'pilum') { g.save(); g.translate(48, 15); g.scale(1.15, 1.15); drawProjectile(g, key, 0, 0, 0, 0, '#ffcdd2'); g.restore(); }
    else drawProjectile(g, key, 48, 15, 0, 0, '#ffcdd2');
    b.append(c);
    b.insertAdjacentHTML('beforeend', `<span class="cname">${P.name}</span><span class="cblurb">${P.blurb}</span>`);
    pr.append(b);
  }
  document.getElementById('menu').addEventListener('click', e => {
    const b = e.target.closest('.choice');
    if (!b) return;
    settings[b.dataset.group] = b.dataset.value;
    saveSettings();
    refreshMenu();
  });
  refreshMenu();
}

function refreshMenu() {
  document.querySelectorAll('.choice').forEach(b => {
    b.classList.toggle('selected', settings[b.dataset.group] === b.dataset.value);
    b.setAttribute('aria-pressed', settings[b.dataset.group] === b.dataset.value);
  });
}

function showMenu() {
  mode = 'menu'; paused = false;
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('gamePanel').classList.add('hidden');
  refreshMenu();
}

function startGame() {
  mode = 'play';
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gamePanel').classList.remove('hidden');
  startMatch();
}

function updatePauseBtn() { document.getElementById('pauseBtn').textContent = paused ? 'Resume (Space)' : 'Pause (Space)'; }
function togglePause() { if (mode !== 'play') return; if (winner) startMatch(); else { paused = !paused; updatePauseBtn(); } }

// ---------- Controls ----------
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (mode === 'menu') {
    if (k === 'enter') { e.preventDefault(); startGame(); }
    return;
  }
  if (k === ' ') { e.preventDefault(); togglePause(); }
  if (k === 'm') showMenu();
  if (k === 'arrowup' || k === 'arrowdown') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function moveToPointer(clientY) {
  if (demo) return;
  const rect = canvas.getBoundingClientRect();
  const y = (clientY - rect.top) * (H / rect.height);
  player.y = clamp(y - SHIELD_HEIGHT / 2, TOP_LIMIT, BOTTOM_LIMIT);
}
canvas.addEventListener('mousemove', e => moveToPointer(e.clientY));
canvas.addEventListener('touchstart', e => { e.preventDefault(); moveToPointer(e.touches[0].clientY); if (winner) startMatch(); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); moveToPointer(e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('click', () => { if (winner) startMatch(); });
document.getElementById('startBtn').addEventListener('click', e => { e.currentTarget.blur(); startGame(); });
document.getElementById('menuBtn').addEventListener('click', e => { e.currentTarget.blur(); showMenu(); });
document.getElementById('pauseBtn').addEventListener('click', e => { e.currentTarget.blur(); togglePause(); });

// When embedded on the website, tell the page how tall we are so the iframe never cuts anything off
function reportHeight() {
  if (window.parent === window) return;
  const h = Math.ceil(document.getElementById('wrap').getBoundingClientRect().height + 24);
  window.parent.postMessage({ type: 'rpp-height', height: h }, '*');
}
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.getElementById('wrap'));
window.addEventListener('resize', reportHeight);

buildMenu();
startMatch();      // sets up names/scoreboard behind the menu
if (params.get('autostart') === '1' || demo) startGame(); else showMenu();
reportHeight();
loop();
</script>
</body>
</html>
